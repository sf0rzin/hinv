name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build with CMake
      run: |
        cmake -B build -A x64
        cmake --build build --config Release

    - name: Run parser safety tests
      run: |
        cmake --build build --config Release --target hinv_tests
        ctest --test-dir build -C Release --output-on-failure

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: hinv-windows-x64
        path: build/Release/hinv.exe
